[tool.basedpyright]
include = ["tools/job_alert", "tests/job_alert"]
pythonVersion = "3.11"
typeCheckingMode = "all"
reportUnnecessaryComparison = "none"

[tool.pytest.ini_options]
testpaths = ["tests/job_alert"]

[tool.ruff]
line-length = 88
src = ["tools", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "D",
  "FIX002",
  "ISC001",
  "ISC003",
  "PERF401",
  "TC001",
  "TC002",
  "TC003",
  "TD002",
  "TD003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "PLR2004", "S101"]
"tools/job_alert/mailer.py" = ["T201"]
"tools/job_alert/monitor.py" = ["T201"]
"tools/job_alert/summary.py" = ["T201"]
