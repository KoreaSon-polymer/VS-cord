name: Legacy funding monitor (manual preview only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r tools/research_monitor_requirements.txt
      - run: python -m tools.research_monitor
        env:
          DRY_RUN: 'true'
