name: Korean permanent careers and funding
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview without sending mail or changing delivery state'
        type: boolean
        default: true
  push:
    paths:
      - 'tools/**/*.py'
      - 'tools/*requirements.txt'
      - 'tests/**'
      - '.github/workflows/research-career-monitor.yml'
permissions:
  contents: write
concurrency:
  group: research-career-monitor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            tools/research_monitor_requirements.txt
            tools/job_alert/requirements.txt
      - run: pip install -r tools/research_monitor_requirements.txt pytest
      - name: Regression tests
        run: python -m pytest tests -q
      - name: Collect and deliver one digest
        env:
          DRY_RUN: ${{ github.event_name == 'push' || inputs.dry_run == true }}
          MONITOR_EMAIL_TO: ${{ secrets.MONITOR_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python -m tools.research_monitor
      - name: Persist successful delivery state
        if: ${{ success() && github.event_name != 'push' && inputs.dry_run != true }}
        run: |
          if git diff --quiet -- tools/research_monitor_state.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/research_monitor_state.json
          git commit -m 'Record delivered career and funding notices'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Save source health and preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-monitor-report
          path: monitor-output/
          retention-days: 14
